# File: dns/backup_dnsmasq.conf
# Extension A: Secondary / Backup DNS Resolver
# Run this on Mohit's machine (Backend A & Backup DNS: 10.7.11.88)

port=53
listen-address=127.0.0.1,10.7.11.88
bind-interfaces

# Upstream public DNS fallback
server=8.8.8.8
server=1.1.1.1

# Identical project records pointing to Mac 2 Edge Proxy
address=/app.team1.test/10.7.11.175
address=/api.team1.test/10.7.11.175

# Query logging for demonstration and evidence
log-queries
log-facility=/tmp/dnsmasq_backup.log
