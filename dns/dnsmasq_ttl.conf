# File: dns/dnsmasq_ttl.conf
# Extension B: DNS TTL & Controlled Record Change
# Demonstrates short TTL for fast service migration

port=53
listen-address=127.0.0.1,10.7.31.13
bind-interfaces

# Set explicit local TTL (30 seconds) for all cached/served records
local-ttl=30
max-ttl=30
min-cache-ttl=30

server=8.8.8.8
server=1.1.1.1

# Default active mapping to Akshith's Edge Proxy
address=/app.team1.test/10.7.11.175
address=/api.team1.test/10.7.11.175

# For testing record change to Standby Edge (Jayadeep - 10.7.9.64)
# address=/app.team1.test/10.7.9.64
# address=/api.team1.test/10.7.9.64

log-queries
log-facility=/tmp/dnsmasq_ttl.log
