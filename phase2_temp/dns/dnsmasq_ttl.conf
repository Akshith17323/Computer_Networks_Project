# File: phase2_temp/dns/dnsmasq_ttl.conf
# Extension B: DNS TTL & Controlled Record Change
# Demonstrates short TTL for fast service migration

port=53
listen-address=127.0.0.1,10.16.13.239
bind-interfaces

# Set explicit local TTL (30 seconds) for all cached/served records
local-ttl=30
max-ttl=30
min-cache-ttl=30

server=8.8.8.8
server=1.1.1.1

# Default active mapping
address=/app.team1.test/10.16.13.1
address=/api.team1.test/10.16.13.1

# For testing record change to Standby Edge (Mac 4 - 10.16.13.71)
# address=/app.team1.test/10.16.13.71
# address=/api.team1.test/10.16.13.71

log-queries
log-facility=/tmp/dnsmasq_ttl.log
