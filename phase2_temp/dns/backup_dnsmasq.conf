# File: phase2_temp/dns/backup_dnsmasq.conf
# Extension A: Secondary / Backup DNS Resolver
# Run this on a designated backup machine (e.g. Mac 3, Mac 4, or secondary interface)

port=53
listen-address=127.0.0.1,10.16.13.37
bind-interfaces

# Upstream public DNS fallback
server=8.8.8.8
server=1.1.1.1

# Identical project records pointing to Mac 2 Edge Proxy
address=/app.team1.test/10.16.13.1
address=/api.team1.test/10.16.13.1

# Query logging for demonstration and evidence
log-queries
log-facility=/tmp/dnsmasq_backup.log
