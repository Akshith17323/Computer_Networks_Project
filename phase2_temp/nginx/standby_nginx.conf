# File: phase2_temp/nginx/standby_nginx.conf
# Extension E: Standby Nginx Edge Proxy
# Run on secondary edge host (e.g. Mac 3 or Mac 4) for DNS cutover demonstration

user root wheel;
pid /tmp/cn_project_nginx_standby.pid;
error_log /tmp/cn_project_error_standby.log info;

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/cn_project_access_standby.log;
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream backend_cluster_standby {
        server 10.7.11.88:3001 max_fails=1 fail_timeout=5s;
        server 10.7.9.64:3002 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 443 ssl;
        listen 8443 ssl;
        server_name app.team1.test api.team1.test;

        ssl_certificate     ../certs/app.team1.test+1.pem;
        ssl_certificate_key ../certs/app.team1.test+1-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Header to clearly prove request was served by Standby Edge
        add_header X-Edge-Node "Standby-Edge" always;

        location / {
            proxy_pass http://backend_cluster_standby;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502;

            proxy_pass_header X-Backend;
            proxy_pass_header Cache-Control;
        }
    }
}
