user root wheel;
pid /tmp/cn_project_nginx.pid;
error_log /tmp/cn_project_error.log info;

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/cn_project_access.log;
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Resilient Upstream Cluster (Extension D: High-Availability Failover)
    upstream backend_cluster {
        # Round-robin balancing with fast health checking
        server 10.16.13.37:3001 max_fails=1 fail_timeout=5s; # Mohit (Mac 3 - Backend A)
        server 10.16.13.71:3002 max_fails=1 fail_timeout=5s; # Jayadeep (Mac 4 - Backend B)
    }

    # HTTP Server (Port 80) -> Redirect to HTTPS
    server {
        listen 80;
        server_name app.team1.test api.team1.test;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server (Ports 443 & 8443)
    server {
        listen 443 ssl;
        listen 8443 ssl;
        server_name app.team1.test api.team1.test;

        ssl_certificate     ../certs/app.team1.test+1.pem;
        ssl_certificate_key ../certs/app.team1.test+1-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # High-Availability Failover Directives (Extension D)
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;

            # Forward application headers
            proxy_pass_header X-Backend;
            proxy_pass_header Cache-Control;
            proxy_pass_header ETag;
        }
    }
}
