# File: phase2_temp/firewall/pf_backend_isolation.conf
# Extension C: Service Isolation (Backend Firewall Rules)
# Restricts direct access to backend ports (3001 and 3002)
# Only Mac 2 (Edge Nginx: 10.16.13.1) and localhost are allowed.

# Definitions
edge_ip = "10.7.11.175"
backend_ports = "{ 3001, 3002 }"

# Default: allow loopback (localhost)
set skip on lo0

# Allow existing connections to continue
pass out quick all keep state

# Allow only Edge Proxy (Mac 2) to connect to backend ports
pass in quick proto tcp from $edge_ip to any port $backend_ports keep state

# Block all other machines from directly accessing the backend ports
block in quick proto tcp from any to any port $backend_ports
